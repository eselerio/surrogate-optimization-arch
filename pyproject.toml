    "openpyxl>=3.1.5",
    "osqp>=1.0.4",
    "pandas>=3.0.1",
    "psutil>=7.2.2",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "threadpoolctl>=3.6.0",
    "tqdm>=4.67.1",
]
